<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R.F CONSTRUCTION CO. (PVT) LTD.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0f172a',
                            DEFAULT: '#1e293b',
                            light: '#334155',
                            accent: '#3b82f6',
                            success: '#10b981',
                            warning: '#f59e0b',
                            danger: '#ef4444'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Header Banner -->
    <header class="bg-brand-dark text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-wider uppercase text-white flex items-center gap-3">
                    <i class="fa-solid fa-building-shield text-brand-accent"></i> R.F CONSTRUCTION CO. (PVT) LTD.
                </h1>
                <p class="text-xs text-slate-400 font-medium tracking-wide mt-1">PLAN-EXECUTE-MONITOR. (Follow - Perform - cheer)</p>
            </div>
            
            <div class="flex items-center gap-4 bg-slate-800/80 px-4 py-2 rounded-lg border border-slate-700 text-xs">
                <div class="flex items-center gap-2">
                    <span id="db-status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span id="db-status-text" class="text-slate-300 font-medium">Enterprise System Active</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Phase Tabs -->
    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-2 overflow-x-auto">
            <button onclick="switchPhase(1)" id="btn-phase1" class="tab-btn px-6 py-3 font-bold text-sm border-b-2 border-brand-accent text-brand-accent flex items-center gap-2 whitespace-nowrap transition-all">
                <i class="fa-solid fa-layer-group"></i> Phase 1: Master Planning
            </button>
            <button onclick="switchPhase(2)" id="btn-phase2" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 whitespace-nowrap transition-all">
                <i class="fa-solid fa-play"></i> Phase 2: Execution & Productivity
            </button>
            <button onclick="switchPhase(3)" id="btn-phase3" class="tab-btn px-6 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2 whitespace-nowrap transition-all">
                <i class="fa-solid fa-chart-line"></i> Phase 3: Monitoring & Field Logs
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full space-y-6">

        <!-- Main Task Input Card (Phase 1 Only) -->
        <div id="taskCreationCard" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
            <input type="text" id="mainTaskInput" placeholder="Enter new main category name & press Enter..." class="flex-grow border border-slate-300 rounded-lg px-4 py-2 text-xs focus:ring-2 focus:ring-brand-accent outline-none">
            <button onclick="addMainTask()" class="bg-brand-accent hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-semibold shadow transition whitespace-nowrap">
                <i class="fa-solid fa-folder-plus mr-1"></i> Add Category
            </button>
        </div>

        <!-- Workspace Board -->
        <div id="workspaceBoard" class="space-y-6"></div>

    </main>

    <!-- Audit History Modal -->
    <div id="audit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full p-6 space-y-4 border border-slate-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="audit-modal-title" class="text-base font-bold text-slate-900">Date-Wise Audit Log History</h3>
                <button onclick="closeAuditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="overflow-x-auto max-h-80">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200 sticky top-0">
                        <tr>
                            <th class="p-2">Date</th>
                            <th class="p-2 text-right">Delivered Qty</th>
                            <th class="p-2 text-right">Crew Deployed</th>
                            <th class="p-2 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="audit-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Field Log Input Modal -->
    <div id="field-log-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-slate-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-900">Record Field Log (Date-Wise)</h3>
                <button onclick="closeFieldLogModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="field-log-form" onsubmit="handleFieldLogSubmit(event)" class="space-y-4 text-xs">
                <input type="hidden" id="log-subtask-id">
                <input type="hidden" id="log-task-id">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Log Date</label>
                    <input type="date" id="log-date" required class="w-full border border-slate-300 rounded-lg p-2">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Delivered Quantity</label>
                    <input type="number" step="any" id="log-qty" required class="w-full border border-slate-300 rounded-lg p-2" value="0">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Workers / Crew Deployed</label>
                    <input type="number" id="log-crew" required class="w-full border border-slate-300 rounded-lg p-2" value="0">
                </div>
                <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
                    <button type="button" onclick="closeFieldLogModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg font-semibold hover:bg-slate-300">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-brand-accent text-white rounded-lg font-semibold hover:bg-blue-600">Submit Log</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const SUPABASE_URL = 'https://nudhzvzmhzghznmpavif.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51ZGh6dnptaHpnaHpubXBhdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQ0MzQsImV4cCI6MjEwNjU5MDQzNH0.3Nm6yvvD1x2wfLbAX_4bc8EjKuev8Kkl-oIpzZvBoBc';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let tasks = [];
        let currentPhase = 1;

        async function loadTasksFromCloud() {
            const { data, error } = await _supabase.from('tasks').select('*');
            if (error) {
                console.error('Error loading tasks:', error.message);
            } else {
                tasks = data || [];
                renderWorkspace();
            }
        }

        async function syncToCloud() {
            if (tasks.length === 0) return;
            const cleanTasks = tasks.map(t => ({
                id: Number(t.id),
                name: String(t.name),
                subtasks: t.subtasks || []
            }));
            const { error } = await _supabase.from('tasks').upsert(cleanTasks);
            if (error) console.error('Sync failed:', error.message);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mainInput = document.getElementById('mainTaskInput');
            if (mainInput) {
                mainInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') addMainTask();
                });
            }
            loadTasksFromCloud();
        });

        function switchPhase(phaseNum) {
            currentPhase = phaseNum;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('border-brand-accent', idx + 1 === phaseNum);
                btn.classList.toggle('text-brand-accent', idx + 1 === phaseNum);
                btn.classList.toggle('border-transparent', idx + 1 !== phaseNum);
                btn.classList.toggle('text-slate-500', idx + 1 !== phaseNum);
            });
            const taskCreationCard = document.getElementById('taskCreationCard');
            if (taskCreationCard) {
                taskCreationCard.style.display = (phaseNum === 1) ? 'flex' : 'none';
            }
            renderWorkspace();
        }

        async function addMainTask() {
            const input = document.getElementById('mainTaskInput');
            if (!input) return;
            const name = input.value.trim();
            if (!name) return;

            const newTask = { id: Date.now(), name: name, subtasks: [] };
            tasks.push(newTask);
            input.value = '';
            await syncToCloud();
            renderWorkspace();
        }

        async function deleteMainTask(id) {
            if (confirm("Are you sure you want to delete this category and all its subtasks?")) {
                tasks = tasks.filter(t => t.id !== id);
                await _supabase.from('tasks').delete().eq('id', id);
                renderWorkspace();
            }
        }

        async function addSubtask(mainTaskId) {
            const nameInput = document.getElementById(`subName-${mainTaskId}`);
            const qtyInput = document.getElementById(`subQty-${mainTaskId}`);
            const unitInput = document.getElementById(`subUnit-${mainTaskId}`);
            const prodInput = document.getElementById(`subProd-${mainTaskId}`);
            const daysInput = document.getElementById(`subDays-${mainTaskId}`);
            const crewInput = document.getElementById(`subCrew-${mainTaskId}`);
            const startInput = document.getElementById(`subStart-${mainTaskId}`);

            const name = nameInput.value.trim();
            if (!name) return;

            const qty = parseFloat(qtyInput.value) || 0;
            const prod = parseFloat(prodInput.value) || 1;
            const crew = parseFloat(crewInput.value) || 1;
            let days = parseFloat(daysInput.value) || Math.ceil(qty / (prod * crew));
            let startDate = startInput.value || new Date().toISOString().split('T')[0];

            const startObj = new Date(startDate);
            const endObj = new Date(startObj);
            endObj.setDate(startObj.getDate() + Math.max(0, days - 1));
            let endDate = endObj.toISOString().split('T')[0];

            const task = tasks.find(t => t.id === mainTaskId);
            if (task) {
                task.subtasks.push({
                    id: Date.now(),
                    name: name,
                    planQty: qty,
                    unit: unitInput.value.trim() || 'm3',
                    planProd: prod,
                    planDays: days,
                    planCrew: crew,
                    planTotalCrew: days * crew,
                    planStart: startDate,
                    planEnd: endDate,
                    logs: [] // Date-wise field logs array
                });
                await syncToCloud();
                renderWorkspace();
            }
        }

        async function updateSubtaskPlan(mainTaskId, subId, field, value) {
            const task = tasks.find(t => t.id === mainTaskId);
            if (!task) return;
            const sub = task.subtasks.find(st => st.id === subId);
            if (!sub) return;

            if (field === 'name' || field === 'unit') {
                sub[field] = value;
            } else if (field === 'planQty') {
                sub.planQty = parseFloat(value) || 0;
            } else if (field === 'planProd') {
                sub.planProd = parseFloat(value) || 1;
            } else if (field === 'planDays') {
                sub.planDays = parseFloat(value) || 1;
            } else if (field === 'planCrew') {
                sub.planCrew = parseFloat(value) || 1;
            } else if (field === 'planStart') {
                sub.planStart = value;
            }

            // Recalculate Total Crew and End Date automatically
            sub.planTotalCrew = sub.planDays * sub.planCrew;
            if (sub.planStart && sub.planDays > 0) {
                const sObj = new Date(sub.planStart);
                sObj.setDate(sObj.getDate() + Math.round(sub.planDays) - 1);
                sub.planEnd = sObj.toISOString().split('T')[0];
            }

            await syncToCloud();
            renderWorkspace();
        }

        async function deleteSubtask(mainTaskId, subId) {
            const task = tasks.find(t => t.id === mainTaskId);
            if (task) {
                task.subtasks = task.subtasks.filter(st => st.id !== subId);
                await syncToCloud();
                renderWorkspace();
            }
        }

        // Field Logging modals & submission
        function openFieldLogModal(mainTaskId, subId) {
            document.getElementById('field-log-modal').classList.remove('hidden');
            document.getElementById('log-task-id').value = mainTaskId;
            document.getElementById('log-subtask-id').value = subId;
            document.getElementById('log-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('log-qty').value = '';
            document.getElementById('log-crew').value = '';
        }

        function closeFieldLogModal() {
            document.getElementById('field-log-modal').classList.add('hidden');
        }

        async function handleFieldLogSubmit(e) {
            e.preventDefault();
            const mainTaskId = Number(document.getElementById('log-task-id').value);
            const subId = Number(document.getElementById('log-subtask-id').value);
            const date = document.getElementById('log-date').value;
            const qty = parseFloat(document.getElementById('log-qty').value) || 0;
            const crew = parseFloat(document.getElementById('log-crew').value) || 0;

            const task = tasks.find(t => t.id === mainTaskId);
            if (task) {
                const sub = task.subtasks.find(st => st.id === subId);
                if (sub) {
                    if (!sub.logs) sub.logs = [];
                    sub.logs.push({ id: 'l-' + Date.now(), date, qty, crew });
                    await syncToCloud();
                }
            }
            closeFieldLogModal();
            renderWorkspace();
        }

        function openAuditModal(mainTaskId, subId) {
            const task = tasks.find(t => t.id === mainTaskId);
            if (!task) return;
            const sub = task.subtasks.find(st => st.id === subId);
            if (!sub) return;

            document.getElementById('audit-modal-title').textContent = `Audit History: ${sub.name}`;
            const tbody = document.getElementById('audit-table-body');
            tbody.innerHTML = '';

            if (!sub.logs || sub.logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-3 text-center text-slate-400 italic">No date-wise logs recorded yet.</td></tr>`;
            } else {
                sub.logs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-2 font-medium text-slate-700">${log.date}</td>
                        <td class="p-2 text-right text-slate-900">${log.qty} ${sub.unit}</td>
                        <td class="p-2 text-right text-slate-600">${log.crew}</td>
                        <td class="p-2 text-center">
                            <button onclick="deleteLogEntry(${mainTaskId}, ${subId}, '${log.id}')" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            document.getElementById('audit-modal').classList.remove('hidden');
        }

        function closeAuditModal() {
            document.getElementById('audit-modal').classList.add('hidden');
        }

        async function deleteLogEntry(mainTaskId, subId, logId) {
            const task = tasks.find(t => t.id === mainTaskId);
            if (task) {
                const sub = task.subtasks.find(st => st.id === subId);
                if (sub && sub.logs) {
                    sub.logs = sub.logs.filter(l => l.id !== logId);
                    await syncToCloud();
                    openAuditModal(mainTaskId, subId);
                    renderWorkspace();
                }
            }
        }

        function renderWorkspace() {
            const board = document.getElementById('workspaceBoard');
            if (!board) return;

            if (tasks.length === 0) {
                board.innerHTML = `<div class="bg-white p-8 rounded-xl text-center text-slate-400 shadow-sm border border-slate-200">No categories created yet. Type a category name above and click Add Category.</div>`;
                return;
            }

            let html = '';
            tasks.forEach(task => {
                let subtasks = task.subtasks || [];
                let totalEstQty = 0, totalDeliveredQty = 0, sumPwdm = 0;

                subtasks.forEach(st => {
                    totalEstQty += (st.planQty || 0);
                    let delivered = (st.logs || []).reduce((acc, l) => acc + (parseFloat(l.qty) || 0), 0);
                    totalDeliveredQty += delivered;
                    let pwdm = st.planQty > 0 ? Math.min(100, (delivered / st.planQty) * 100) : 0;
                    sumPwdm += pwdm;
                });

                let meanPwdm = subtasks.length > 0 ? (sumPwdm / subtasks.length).toFixed(1) : 0;
                let catProgress = totalEstQty > 0 ? Math.min(100, (totalDeliveredQty / totalEstQty) * 100).toFixed(1) : 0;

                html += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-5 py-3 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div class="font-bold text-slate-900 flex items-center gap-2">
                                <i class="fa-solid fa-folder text-brand-accent"></i> ${task.name}
                            </div>
                            <div class="flex flex-wrap items-center gap-3 text-xs">
                                <span class="bg-white px-3 py-1 rounded-md border border-slate-200 shadow-xs">Mean PWDM: <b class="text-brand-accent">${meanPwdm}%</b></span>
                                <span class="bg-white px-3 py-1 rounded-md border border-slate-200 shadow-xs">Progress: <b class="text-emerald-600">${catProgress}%</b></span>
                                ${currentPhase === 1 ? `<button onclick="deleteMainTask(${task.id})" class="text-rose-500 hover:text-rose-700 font-semibold"><i class="fa-solid fa-trash"></i> Delete Category</button>` : ''}
                            </div>
                        </div>
                        <div class="p-4 overflow-x-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200">
                `;

                if (currentPhase === 1) {
                    html += `
                        <tr>
                            <th class="p-3">Subtask Name</th>
                            <th class="p-3 text-right">Est. Qty</th>
                            <th class="p-3 text-center">Unit</th>
                            <th class="p-3 text-right">Productivity</th>
                            <th class="p-3 text-right">Days</th>
                            <th class="p-3 text-right">Crew/Day</th>
                            <th class="p-3 text-right text-brand-accent">Total Crew</th>
                            <th class="p-3">Start Date</th>
                            <th class="p-3">End Date (Auto)</th>
                            <th class="p-3 text-center">Actions</th>
                        </tr>
                    `;
                } else if (currentPhase === 2) {
                    html += `
                        <tr>
                            <th class="p-3">Subtask Name</th>
                            <th class="p-3 text-right">Delivered / Est</th>
                            <th class="p-3 text-right">Actual Crew</th>
                            <th class="p-3">Actual Window (Start - End)</th>
                            <th class="p-3 text-right">Exec Prod</th>
                            <th class="p-3 text-center">PWDM Index</th>
                            <th class="p-3">Performance Bar</th>
                        </tr>
                    `;
                } else {
                    html += `
                        <tr>
                            <th class="p-3">Subtask Name</th>
                            <th class="p-3 text-right">Total Delivered Qty</th>
                            <th class="p-3 text-center">Audit Logs</th>
                            <th class="p-3 text-center">Action / Log Entry</th>
                        </tr>
                    `;
                }

                html += `</thead><tbody class="divide-y divide-slate-100">`;

                if (subtasks.length === 0) {
                    let spanCols = currentPhase === 3 ? 4 : 10;
                    html += `<tr><td colspan="${spanCols}" class="p-4 text-center text-slate-400 italic">No subtasks added yet.</td></tr>`;
                } else {
                    subtasks.forEach(st => {
                        let delivered = (st.logs || []).reduce((acc, l) => acc + (parseFloat(l.qty) || 0), 0);
                        let actualCrew = (st.logs && st.logs.length > 0) ? Math.max(...st.logs.map(l => l.crew || 0)) : 0;
                        let logDates = (st.logs || []).map(l => l.date).sort();
                        let actualStart = logDates.length > 0 ? logDates[0] : '-';
                        let actualEnd = logDates.length > 0 ? logDates[logDates.length - 1] : '-';

                        let elapsedDays = 1;
                        if (actualStart !== '-' && actualEnd !== '-') {
                            let dDiff = Math.abs(new Date(actualEnd) - new Date(actualStart));
                            elapsedDays = Math.max(1, Math.ceil(dDiff / (1000 * 60 * 60 * 24)) + 1);
                        }
                        let execProd = (actualCrew > 0 && elapsedDays > 0) ? (delivered / (actualCrew * elapsedDays)).toFixed(2) : '0.00';
                        let pwdmIndex = st.planQty > 0 ? Math.min(100, Math.round((delivered / st.planQty) * 100)) : 0;

                        if (currentPhase === 1) {
                            html += `
                                <tr class="hover:bg-slate-50/80 transition">
                                    <td class="p-3"><input type="text" value="${st.name}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'name', this.value)" class="w-full border border-slate-200 rounded p-1"></td>
                                    <td class="p-3 text-right"><input type="number" step="any" value="${st.planQty}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'planQty', this.value)" class="w-20 border border-slate-200 rounded p-1 text-right"></td>
                                    <td class="p-3 text-center"><input type="text" value="${st.unit}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'unit', this.value)" class="w-16 border border-slate-200 rounded p-1 text-center"></td>
                                    <td class="p-3 text-right"><input type="number" step="any" value="${st.planProd}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'planProd', this.value)" class="w-20 border border-slate-200 rounded p-1 text-right"></td>
                                    <td class="p-3 text-right"><input type="number" step="any" value="${st.planDays}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'planDays', this.value)" class="w-16 border border-slate-200 rounded p-1 text-right"></td>
                                    <td class="p-3 text-right"><input type="number" step="any" value="${st.planCrew}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'planCrew', this.value)" class="w-16 border border-slate-200 rounded p-1 text-right"></td>
                                    <td class="p-3 text-right font-semibold text-brand-accent">${st.planTotalCrew}</td>
                                    <td class="p-3"><input type="date" value="${st.planStart || ''}" onchange="updateSubtaskPlan(${task.id}, ${st.id}, 'planStart', this.value)" class="border border-slate-200 rounded p-1"></td>
                                    <td class="p-3 font-semibold text-slate-600">${st.planEnd || '-'}</td>
                                    <td class="p-3 text-center"><button onclick="deleteSubtask(${task.id}, ${st.id})" class="text-rose-500 hover:text-rose-700"><i class="fa-solid fa-trash"></i></button></td>
                                </tr>
                            `;
                        } else if (currentPhase === 2) {
                            html += `
                                <tr class="hover:bg-slate-50/80 transition">
                                    <td class="p-3 font-medium text-slate-800">${st.name}</td>
                                    <td class="p-3 text-right font-semibold">${delivered} / ${st.planQty} ${st.unit}</td>
                                    <td class="p-3 text-right">${actualCrew} Workers</td>
                                    <td class="p-3 text-slate-600">${actualStart} to ${actualEnd}</td>
                                    <td class="p-3 text-right font-bold text-brand-accent">${execProd}</td>
                                    <td class="p-3 text-center font-bold">${pwdmIndex}%</td>
                                    <td class="p-3">
                                        <div class="flex items-center gap-2">
                                            <div class="w-full bg-slate-200 rounded-full h-2">
                                                <div class="bg-emerald-500 h-2 rounded-full" style="width: ${pwdmIndex}%"></div>
                                            </div>
                                            <span class="text-[10px] text-slate-500">${pwdmIndex}%</span>
                                        </div>
                                    </td>
                                </tr>
                            `;
                        } else {
                            html += `
                                <tr class="hover:bg-slate-50/80 transition">
                                    <td class="p-3 font-medium text-slate-800">${st.name}</td>
                                    <td class="p-3 text-right font-bold text-slate-900">${delivered} / ${st.planQty} ${st.unit}</td>
                                    <td class="p-3 text-center">
                                        <button onclick="openAuditModal(${task.id}, ${st.id})" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold shadow-xs transition">
                                            <i class="fa-solid fa-list-check mr-1 text-brand-accent"></i> View Logs (${st.logs ? st.logs.length : 0})
                                        </button>
                                    </td>
                                    <td class="p-3 text-center">
                                        <button onclick="openFieldLogModal(${task.id}, ${st.id})" class="px-3 py-1 bg-brand-accent hover:bg-blue-600 text-white rounded-lg text-xs font-semibold shadow transition">
                                            <i class="fa-solid fa-plus mr-1"></i> Add Entry
                                        </button>
                                    </td>
                                </tr>
                            `;
                        }
                    });
                }

                if (currentPhase === 1) {
                    html += `
                        <tr class="bg-slate-50/60">
                            <td class="p-3"><input type="text" id="subName-${task.id}" placeholder="New subtask name..." class="w-full border border-slate-300 rounded p-1"></td>
                            <td class="p-3 text-right"><input type="number" id="subQty-${task.id}" placeholder="Qty" step="any" class="w-20 border border-slate-300 rounded p-1 text-right"></td>
                            <td class="p-3 text-center"><input type="text" id="subUnit-${task.id}" value="m3" class="w-16 border border-slate-300 rounded p-1 text-center"></td>
                            <td class="p-3 text-right"><input type="number" id="subProd-${task.id}" value="20" step="any" class="w-20 border border-slate-300 rounded p-1 text-right"></td>
                            <td class="p-3 text-right"><input type="number" id="subDays-${task.id}" value="5" step="any" class="w-16 border border-slate-300 rounded p-1 text-right"></td>
                            <td class="p-3 text-right"><input type="number" id="subCrew-${task.id}" value="10" step="any" class="w-16 border border-slate-300 rounded p-1 text-right"></td>
                            <td class="p-3 text-right">—</td>
                            <td class="p-3"><input type="date" id="subStart-${task.id}" class="border border-slate-300 rounded p-1"></td>
                            <td class="p-3">—</td>
                            <td class="p-3 text-center">
                                <button onclick="addSubtask(${task.id})" class="bg-brand-success hover:bg-emerald-600 text-white px-3 py-1 rounded text-xs font-semibold shadow transition">Add</button>
                            </td>
                        </tr>
                    `;
                }

                html += `</tbody></table></div></div>`;
            });

            board.innerHTML = html;
        }
    </script>
</body>
</html>
